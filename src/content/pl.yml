        text: "Umowa jest w języku, który rozumiesz, przekazanie mieszkania jest udokumentowane, a Ty wprowadzasz się w dniu przyjazdu."
  nonneg:
    title: "Cztery zasady, od których nie odstępujemy"
    items:
      - title: "Każdą sprawę prowadzi konkretna osoba"
        text: "Program może sortować oferty. Mieszkanie sprawdza i odpowiada Ci człowiek."
      - title: "Nic nie płacisz za niesprawdzone"
        text: "Nigdy nie prosimy o pieniądze za mieszkanie, którego nikt nie zweryfikował."
      - title: "Mówimy, kto nam płaci"
        text: "Jeśli wynajmujący lub akademik płaci nam za Twoje zakwaterowanie, widzisz to przed decyzją."
      - title: "Stała opłata, nie procent od czynszu"
        text: "Nasza opłata nie rośnie razem z czynszem, więc nie mamy powodu namawiać Cię na droższe."
  steps:
    title: "Od pierwszej wiadomości do kluczy"
    pay_label: "Tu płacisz"
    not_instant: "Sprawdzona lista zajmuje kilka dni. Nie zarezerwujemy dziś wieczorem mieszkania, którego nikt nie widział."
    items:
