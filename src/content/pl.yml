        text: "Daty, budżet, uczelnia albo miejsce pracy, w jednej wiadomości. Szukamy do 8 tygodni przed Twoim przyjazdem."
      - title: "Dostajesz 3–5 sprawdzonych opcji"
        text: "Każdą ktoś z nas obejrzał na miejscu albo sprawdził na wideo na żywo. Pełny koszt miesięczny to jedna liczba."
      - title: "Oglądasz na żywo"
        text: "Na wideo z kimś z nas albo osobiście, jeśli już jesteś w Warszawie."
      - title: "Podpisujesz umowę, którą rozumiesz"
        text: "Omawiamy ją z Tobą prostym językiem i rozmawiamy z wynajmującym po polsku. Nasza opłata: [[confirm:pay_on_signing]], nie wcześniej."
