    title: "Słowniczek polskiej umowy najmu | Doorstep"
    description: "Czynsz, czynsz administracyjny, kaucja, umowa najmu, media i trzy inne: osiem słów z ogłoszeń i umów najmu, każde wyjaśnione jednym prostym zdaniem."
