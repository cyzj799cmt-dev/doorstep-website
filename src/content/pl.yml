    review: "[[confirm:glossary_reviewed]]"
  words:
    - id: "czynsz"
      term: "czynsz"
      text: "W ogłoszeniach zwykle kwota płacona co miesiąc wynajmującemu, więc sprawdź, czy obejmuje też opłatę za budynek."
    - id: "czynsz-administracyjny"
      term: "czynsz administracyjny"
      text: "Opłata za budynek. Dochodzi do czynszu najmu, a cena, którą pokazujemy, już ją zawiera."
    - id: "kaucja"
      term: "kaucja"
      text: "Zwykle równowartość miesięcznego czynszu, płacona raz i zwracana przy wyprowadzce, pomniejszona o udokumentowane szkody."
    - id: "umowa-najmu"
      term: "umowa najmu"
      text: "Umowa między Tobą a wynajmującym: sprawdź daty, okres wypowiedzenia i zasady zwrotu kaucji."
    - id: "media"
      term: "media"
      text: "Prąd, gaz, woda, ogrzewanie i internet: sprawdź, które są w czynszu administracyjnym, a za które płacisz osobno."
    - id: "protokol"
      term: "protokół zdawczo-odbiorczy"
      text: "Zapis stanu mieszkania, stanów liczników i zdjęć, podpisywany przy wprowadzeniu się i ponownie przy wyprowadzce."
    - id: "najem-okazjonalny"
      term: "najem okazjonalny"
      text: "Rodzaj umowy, który daje wynajmującemu dodatkową ochronę; zwykle wymaga oświadczenia u notariusza i wskazania adresu, pod który możesz się wyprowadzić."
    - id: "odstepne"
      term: "odstępne"
