      - {quote: "Our students keep asking us about housing.", link: "For universities", page: "universities", persona: "agnieszka"}
      - {quote: "I have empty rooms before term starts.", link: "For residences and landlords", page: "landlords", persona: "piotr"}
  fee:
    eyebrow: "What it costs"
    title: "A fixed fee, not a share of your rent."
    link: "What the fee covers"
    compare:
      agency: "Typical Warsaw agency, on a 1,800 PLN room"
      agency_value: "≈ 1,800 PLN"
      us: "Doorstep Student Search"
      us_value: "[[confirm:fee_student]]"
