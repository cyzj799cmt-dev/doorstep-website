guide_fake:
  meta:
    title: "How to spot a fake Warsaw rental listing | Doorstep"
    description: "Five patterns fake rental listings in Warsaw share, and what to do instead. One rule above all: never send a deposit for a flat nobody has seen."
    crumb: "Fake listings"
  hero:
    eyebrow: "Guide"
    title: "How to spot a fake Warsaw listing"
    lead: "Searching from abroad, you can’t stand in the flat. These are the patterns to look out for, and what to do instead."
    review: "[[confirm:fake_listing_patterns]]"
  sign_label: "Sign"
  instead_label: "What to do instead"
  patterns:
    - title: "A deposit before any viewing"
      text:
        - "The landlord asks for a deposit or a reservation fee before anyone has seen the flat, often because many people are interested."
      instead:
        - "Pay nothing until you, or someone you trust, has been inside or watched a live video. A real landlord can wait for a viewing."
    - title: "No live video"
      text:
        - "You ask for a live video call and get excuses, or the same photos again."
      instead:
        - "Ask for a live video in which the person walks through the flat and shows the view from a window. Photos and recorded videos can be copied from other ads."
    - title: "Pressure to decide today"
      text:
        - "You’re told someone else will take it tonight unless you pay now."
      instead:
        - "Take the time to check. A flat worth having is still worth having after a viewing."
    - title: "A price far below the usual range"
      text:
        - "A room or flat offered for much less than similar ones nearby."
      instead:
        - "Compare with the usual ranges: a room in a shared flat costs 1,400–2,200 PLN a month, a 1–2-room flat 2,800–4,500 PLN. If it looks too cheap, ask why before anything else."
    - title: "The conversation moves off the platform"
      text:
        - "Soon after your first message, you’re asked to continue on another app or by private email, and to pay there."
      instead:
        - "Keep the conversation where the ad is until you’ve seen the flat, and never pay by a method you can’t trace."
  closing: "Never send a deposit for a flat nobody has seen."
  source: "Price ranges: Kozminski University, student living costs (May 2026)."
  soft_cta:
    title: "Rather have someone check it for you?"
    text: "Every flat we offer has been visited in person or checked live on video by one of us, before you pay anything."
    links:
      - {page: "students", label: "For students"}
      - {page: "parents", label: "For parents"}

guide_words:
  meta:
    title: "Polish rental contract words, explained | Doorstep"
    description: "Czynsz, czynsz administracyjny, kaucja, umowa najmu, media and three more: eight words from Polish rental ads and contracts, each in one plain sentence."
    crumb: "Rental words"
  hero:
    eyebrow: "Guide"
    title: "Words in your Polish rental contract"
    lead: "Eight words you will meet in ads and contracts, each explained once."
    review: "[[confirm:glossary_reviewed]]"
  words:
    - id: "czynsz"
      term: "czynsz"
      text: "Rent: in ads it usually means what you pay the landlord each month, so check whether the building charge is included."
    - id: "czynsz-administracyjny"
      term: "czynsz administracyjny"
      text: "The building charge. It comes on top of the rent, and the price we show you includes it."
    - id: "kaucja"
      term: "kaucja"
      text: "The deposit, usually one month’s rent, paid once and returned when you move out, minus any documented damage."
    - id: "umowa-najmu"
      term: "umowa najmu"
      text: "The rental contract between you and the landlord: check the dates, the notice period and what happens to the deposit."
    - id: "media"
      term: "media"
      text: "Utilities, such as electricity, gas, water, heating and internet: check which are in the building charge and which you pay separately."
    - id: "protokol"
      term: "protokół zdawczo-odbiorczy"
      text: "The handover record: the flat’s condition, meter readings and photos, signed when you move in and again when you move out."
    - id: "najem-okazjonalny"
      term: "najem okazjonalny"
      text: "A type of rental contract that gives the landlord extra protection; it usually needs a notarised statement from you and an address you could move to."
    - id: "odstepne"
      term: "odstępne"
      text: "A one-off payment to take over a flat or its furniture from someone else: ask what exactly you are paying for."
  source: "[[pl:Czynsz administracyjny]] and [[pl:kaucja]]: IBB PAS Welcome Center, accommodation guide. The other words: general guidance, not legal advice."
