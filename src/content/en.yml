    eyebrow: "Warsaw · housing search, done for you"
    title: "Arrive to a home that’s real, checked and yours."
    lead: "We find, check, negotiate and book. You choose. One of us has been inside every flat before you pay anything."
    chips:
      - "[[confirm:fee_student]] fixed fee"
      - "[[confirm:pay_on_signing]]"
      - "3–5 checked options"
  doors:
    title: "Which one sounds like you?"
    people:
      - {quote: "I’m coming for a semester and still don’t have a room.", link: "For exchange and degree students", page: "students", persona: "lena"}
