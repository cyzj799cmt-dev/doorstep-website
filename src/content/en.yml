    text: "We’ll come back with three to five options. Searches start up to 8 weeks before you arrive."

students:
  meta:
    title: "Rooms for exchange and degree students in Warsaw | Doorstep"
    description: "A room for your semester in Warsaw, seen by one of us before you pay. Stays of 4–12 months, landlord handled in Polish, full monthly cost in one number."
  hero:
    eyebrow: "For exchange and degree students"
    title: "Coming for a semester? Land with a room someone has seen."
    lead: "Tell us your dates, budget and campus once. We send three to five checked options for stays of 4 to 12 months, and handle the landlord in Polish."
    cta: "Send my dates"
    cta_wa: "Ask on WhatsApp first"
    record:
      - {k: "Stays", v: "4–12 months"}
      - {k: "You get", v: "3–5 checked options"}
      - {k: "Viewings", v: "In person or on live video"}
      - {k: "Fee", v: "[[confirm:fee_student]]"}
      - {k: "You pay", v: "[[confirm:pay_on_signing]]"}
      - {k: "Landlord", v: "Handled in Polish"}
  questions:
    title: "The four questions everyone asks"
    items:
      - id: "real"
        q: "Is this offer real, or a scam?"
        a:
          - "Every flat we send has been visited in person or checked live on video by one of us, before you pay anything. You get the video."
          - "Never send a deposit for a flat nobody has seen. We never ask you to."
        link: {page: "guide_fake", label: "How to spot a fake Warsaw listing"}
      - id: "short"
        q: "Can I rent for five months only?"
        a:
          - "Yes. We search for stays of 4 to 12 months and tell landlords your dates in the first message, so nobody wastes your time."
          - "[[confirm:shortlist_accepts_dates]]"
      - id: "cost"
        q: "What do [[pl:czynsz]] and [[pl:kaucja]] add to the price?"
        a:
          - "[[pl:Czynsz administracyjny]] is the building charge. It comes on top of the rent, and the price we show you includes it. [[pl:Kaucja]] is the deposit, usually one month’s rent, paid once."
          - "We show you one monthly number with everything in it, and the deposit on its own line:"
      - id: "campus"
        q: "How far is it from my campus?"
        a:
          - "You tell us your university. We search around it {?[[confirm:travel_time_per_option]]?}."
          - "{?Which districts work for which campus: [[fill:districts_by_campus]]?}"
  price_title: "What it costs"
  brief:
    title: "Send us your dates"
    text: "Six questions. A named person reads your answers and replies."
  contact:
    title: "Who answers you"
    text: "One person handles your search, from your first message to your keys."
  faq:
    title: "Before you ask"
    items:
      - id: "students_shortest"
        q: "What’s the shortest stay you handle?"
        a: "Four months for students. We don’t do stays under a month: those belong to hotels and holiday lets."
      - id: "students_legal"
        q: "Do you check the contract legally?"
        a: "No, we’re not lawyers. We walk you through the contract in plain English before you sign, but we don’t give legal advice."
      - id: "students_languages"
        q: "Which languages do you speak?"
        a: "[[confirm:languages]]. With the landlord, we speak Polish."
      - id: "students_nothing"
        q: "What if nothing on the shortlist fits?"
        a: "[[confirm:no_home_no_fee]] [[confirm:pay_on_signing]]."
      - id: "students_abroad"
        q: "How do I pay from abroad?"
        a: "By bank transfer when you sign. {?Payment details: [[fill:payment_methods]]?}"
  share:
    title: "Coming with other students?"
    text: "Send this page to your incoming students’ group."
    button: "Copy the link"
    copied: "Link copied. Paste it in your group chat."
    wa: "Message us on WhatsApp"

